name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.401'

      - name: Restore
        run: dotnet restore ShiftsLogger.slnx

      - name: Build
        run: dotnet build ShiftsLogger.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test ShiftsLogger.slnx --configuration Release --no-build --verbosity normal
